[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "ciicerone" },
]

[project]
name = "ciicerone"
version = "0.1.0"
description = "Ciicerone – AI-powered threat simulation and intelligence platform"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "Uzo" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "openai>=1.6.1",
    "anthropic>=0.8.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.23",
    "alembic>=1.13.0",
    "httpx>=0.25.2",
    "jinja2>=3.1.2",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.30",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "tenacity>=8.2.3",
    "anyio>=4.5",
    "aiohttp>=3.14.1",
    "requests>=2.28.0",
    "mcp>=1.0.0",
    "starlette>=1.3.1",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "beautifulsoup4>=4.12.2",
    "psutil>=5.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.5",
    "coverage>=7.3.2",
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.8",
    "pymdown-extensions>=10.21.3",
]
test = [
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
    "httpx>=0.25.2",
    "respx>=0.20.2",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ciicerone = "ciicerone.cli.main:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top
    "E722",   # Bare except
    "E741",   # Ambiguous variable name
    "F401",   # Unused import
    "F402",   # Import shadowed by loop var
    "F541",   # f-string without placeholders (cosmetic)
    "F811",   # Redefinition of unused name
    "F821",   # Undefined name
    "F841",   # Local variable assigned but never used
    "W291",   # Trailing whitespace
    "W292",   # No newline at end of file
    "W293",   # Blank line contains whitespace
]
fixable = ["ALL"]
unfixable = []

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["ciicerone"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = [
    "B101",  # assert_used - acceptable in non-production code
    "B104",  # hardcoded_bind_all_interfaces - intentional for API servers
    "B108",  # hardcoded_tmp_directory - acceptable for temp files
    "B110",  # try_except_pass - sometimes intentional
    "B113",  # request_without_timeout - handled at higher level
    "B404",  # blacklist import subprocess - necessary for VM management
    "B506",  # yaml_load - using safe loader already
    "B601",  # paramiko calls - necessary for SSH
    "B603",  # subprocess_without_shell - using list args (safe)
    "B607",  # start_process_with_partial_path - docker commands
    "B615",  # huggingface unsafe download - handled separately
]
